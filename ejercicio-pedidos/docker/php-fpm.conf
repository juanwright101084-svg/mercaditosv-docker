[www]
; Solo escucha dentro del contenedor (Nginx está en el mismo contenedor)
listen = 127.0.0.1:9000
; Conserva las variables de entorno del contenedor (DB_*, STRIPE_*, APP_KEY...)
clear_env = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
